<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HPP Bubble Wrap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<style>
  html,body{margin:0;padding:0}
  img{max-width:100%}
  [hidden]{display:none!important}

  /* Layout: satu kalkulator "Dari Harga Acuan". Putih + biru korporat. */
  :root{
    --bg:#eef2f9;
    --surface:#ffffff;
    --surface-2:#f6f8fc;
    --fg:#0e1f3d;
    --muted:#5c6b86;
    --line:#e3e9f3;
    --line-strong:#d2dcec;
    --accent:#1457d6;
    --accent-strong:#0b3fa8;
    --accent-soft:#e7f0ff;
    --pos:#157a3c;
    --neg:#c1281f;
    --shadow:0 1px 2px rgba(14,31,61,.05), 0 8px 24px rgba(14,31,61,.07);
    --font-sans:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
    --font-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
    color-scheme:light;
  }

  *{box-sizing:border-box}
  body{background:var(--bg);color:var(--fg);font-family:var(--font-sans);line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{
    max-width:760px;margin:0 auto;
    padding-left:max(16px,env(safe-area-inset-left,0px));
    padding-right:max(16px,env(safe-area-inset-right,0px));
    padding-block:28px 40px;
  }

  header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
  .brand .eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);font-weight:700}
  h1{font-size:1.6rem;font-weight:800;letter-spacing:-.02em;margin:.15rem 0 0;text-wrap:balance}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
  .panel{padding:20px}

  small.lbl{display:block;font-size:.72rem;color:var(--muted);font-weight:600;margin-bottom:6px;text-align:center}
  .acuan-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .acuan-grid .full{grid-column:1/-1}
  .mini-input{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line-strong);border-radius:10px;background:var(--surface-2);padding:9px 12px}
  .mini-input:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .rp{font-size:.92rem;font-weight:700;color:var(--muted)}
  .mini-input input{border:0;outline:0;background:transparent;color:var(--fg);width:100%;font-family:var(--font-mono);font-weight:700;font-size:1.05rem;min-width:0}
  select.sel-select{border:0;outline:0;background:transparent;color:var(--fg);width:100%;font-family:var(--font-mono);font-weight:700;font-size:1.05rem;cursor:pointer}
  select.sel-select option{background:var(--surface);color:var(--fg)}

  /* Tabel */
  .table-card{overflow:hidden}
  .table-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 12px;gap:12px;flex-wrap:wrap}
  .table-head h2{font-size:1rem;font-weight:700;margin:0}
  .table-scroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse;min-width:460px}
  thead th{font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--accent-strong);font-weight:800;
    text-align:center;padding:11px 16px;border-top:2px solid var(--accent);border-bottom:2px solid var(--accent);background:var(--accent-soft);white-space:nowrap}
  tbody td{padding:10px 16px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover{background:var(--surface-2)}
  tr.anchor-row{background:var(--accent-soft)!important}
  .uk{font-family:var(--font-mono);font-weight:700;font-size:.98rem}
  .uk small{color:var(--muted);font-weight:500;font-size:.75rem;margin-left:3px}
  .cell-mono{font-family:var(--font-mono);font-weight:600;font-size:.92rem}
  .cell-hpp{color:var(--muted)}
  .cell-sel{color:var(--muted);font-size:.85rem}
  .cell-hasil{font-weight:700;font-size:.98rem}
  .cell-margin{font-family:var(--font-mono);font-weight:700;font-size:.95rem}
  .cell-margin.pos{color:var(--pos)} .cell-margin.neg{color:var(--neg)}

  .btn{border:0;border-radius:10px;padding:9px 15px;font-family:var(--font-sans);font-weight:700;font-size:.85rem;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s}
  .btn-ghost{background:transparent;color:var(--muted);border:1.5px solid var(--line-strong)}
  .btn-ghost:hover{color:var(--accent);border-color:var(--accent)}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-primary:hover{background:var(--accent-strong)}

  .overlay{position:fixed;inset:0;background:rgba(14,31,61,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:30}
  .overlay.show{display:flex}
  .modal{background:var(--surface);border-radius:16px;max-width:min(94vw,520px);max-height:90vh;overflow:auto;padding:16px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .modal img{width:100%;height:auto;border:1px solid var(--line);border-radius:10px;display:block}
  .modal .cap{color:var(--muted);font-size:.82rem;margin:12px 4px;text-align:center;line-height:1.5}
  .modal .mrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .jpg-controls{margin-bottom:12px}
  .jpg-controls .fld{margin-bottom:8px}
  .jpg-controls .fld:last-child{margin-bottom:0}
  .jpg-controls .clbl{display:block;font-size:.62rem;color:var(--muted);font-weight:700;margin-bottom:4px;text-transform:uppercase;letter-spacing:.03em}
  .jpg-controls input{width:100%;border:1.5px solid var(--line-strong);border-radius:8px;padding:6px 9px;font-family:var(--font-sans);font-size:.78rem;color:var(--fg);background:var(--surface-2);font-weight:600}
  .jpg-controls input:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .chips{display:flex;flex-wrap:nowrap;gap:4px}
  .chip{flex:1 1 auto;min-width:0;border:1.5px solid var(--line-strong);background:var(--surface);color:var(--muted);border-radius:999px;padding:4px 6px;font-family:var(--font-sans);font-weight:700;font-size:.66rem;white-space:nowrap;cursor:pointer;transition:background .15s,color .15s}
  .chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}

  footer{margin-top:22px;text-align:center;color:var(--muted);font-size:.76rem}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(12px);background:var(--fg);color:var(--bg);
    padding:10px 18px;border-radius:999px;font-weight:600;font-size:.85rem;opacity:0;pointer-events:none;transition:all .25s;z-index:20}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* HP: tampilan sama persis kaya web — input tetap 1 baris & tabel utuh, cuma diperkecil biar muat */
  @media (max-width:560px){
    .panel{padding:14px}
    .acuan-grid{gap:7px}
    small.lbl{font-size:.6rem;margin-bottom:4px;line-height:1.25}
    .mini-input{padding:7px 7px;gap:3px;border-radius:8px}
    .rp{font-size:.72rem}
    .mini-input input{font-size:.8rem}
    select.sel-select{font-size:.8rem}

    table{min-width:0}
    thead th{font-size:.56rem;padding:8px 4px;letter-spacing:.02em}
    tbody td{padding:9px 4px}
    .uk{font-size:.8rem}
    .uk small{font-size:.62rem;margin-left:2px}
    .cell-mono,.cell-hasil,.cell-margin{font-size:.72rem}
    .cell-sel{font-size:.7rem}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="brand">
      <div class="eyebrow">KIMOKE GROUP</div>
      <h1>HPP Bubble Wrap per Ukuran</h1>
    </div>
  </header>

  <!-- Input acuan -->
  <div class="card panel">
    <div class="acuan-grid">
      <div>
        <small class="lbl">Ukuran Acuan</small>
        <div class="mini-input"><select id="anchorSize" class="sel-select" aria-label="Ukuran acuan"></select></div>
      </div>
      <div>
        <small class="lbl">HPP</small>
        <div class="mini-input"><span class="rp">Rp</span><input id="hppAcuan" inputmode="numeric" autocomplete="off" placeholder="50.000" aria-label="HPP ukuran acuan"></div>
      </div>
      <div>
        <small class="lbl">Harga Jual</small>
        <div class="mini-input"><span class="rp">Rp</span><input id="anchorPrice" inputmode="numeric" autocomplete="off" placeholder="75.000" aria-label="Harga jual ukuran acuan"></div>
      </div>
      <div>
        <small class="lbl">Selisih Harga</small>
        <div class="mini-input"><span class="rp">Rp</span><input id="stepVal" inputmode="numeric" autocomplete="off" placeholder="2.000" aria-label="Selisih harga per ukuran"></div>
      </div>
    </div>
  </div>

  <!-- Tabel -->
  <div class="card table-card">
    <div class="table-head">
      <h2>Daftar Harga Bubble Wrap</h2>
      <button class="btn btn-primary" id="jpgBtn">Simpan JPG</button>
    </div>
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>Ukuran</th>
            <th>HPP</th>
            <th>Selisih</th>
            <th>Harga Jual</th>
            <th>Margin</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>

  <footer>KIMOKE GROUP</footer>
</div>

<div class="overlay" id="jpgOverlay">
  <div class="modal">
    <div class="jpg-controls">
      <div class="fld">
        <span class="clbl">Nama / Judul</span>
        <input id="brandName" type="text" maxlength="40" autocomplete="off" value="KIMOKE GROUP">
      </div>
      <div class="fld">
        <span class="clbl">Kolom ditampilkan</span>
        <div class="chips" id="colChips">
          <button type="button" class="chip active" data-col="uk">Ukuran</button>
          <button type="button" class="chip active" data-col="hpp">HPP</button>
          <button type="button" class="chip active" data-col="sel">Selisih</button>
          <button type="button" class="chip active" data-col="jadi">Harga Jual</button>
          <button type="button" class="chip active" data-col="mar">Margin</button>
        </div>
      </div>
    </div>
    <img id="jpgImg" alt="Daftar harga Bubble Wrap">
    <div class="cap">Klik <b>Download JPG</b> untuk simpan, atau tekan lama gambar (HP) untuk bagikan ke WhatsApp.</div>
    <div class="mrow">
      <button class="btn btn-primary" id="jpgDownload">Download JPG</button>
      <button class="btn btn-ghost" id="jpgClose">Tutup</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  // ---- Ukuran: 1.5 Kg s/d 3.3 Kg (disimpan sebagai per-sepuluh: 15..33) ----
  var SIZES = [];
  for (var t = 15; t <= 33; t++) SIZES.push(t);

  // ---- State (angka contoh) ----
  var anchorT    = 30;      // ukuran acuan → 3.0 Kg
  var hppAcuan   = 50000;   // HPP di ukuran acuan
  var anchorPrice= 75000;   // harga jual di ukuran acuan
  var step       = 2000;    // selisih harga jual tiap 0.1 Kg

  // Gramasi (gram) per ukuran: berat gram − 60. Tiap 0.1 Kg beda 100.
  function gramasi(t){ return t * 100 - 60; }

  // Nilai per ukuran
  function hppOf(t){ return Math.round(hppAcuan * gramasi(t) / gramasi(anchorT)); }
  function selisihOf(t){ return (t - anchorT) * step; }
  function hargaJadiOf(t){ return anchorPrice + selisihOf(t); }
  function marginOf(t){ return hargaJadiOf(t) - hppOf(t); }

  // ---- Format ----
  function groupDigits(s){ return s.replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
  function fmtRp(n){ var neg = n < 0; n = Math.abs(Math.round(n)); return (neg?'-':'')+'Rp '+groupDigits(String(n)); }
  function fmtSigned(n){ if(n===0) return 'Rp 0'; return (n>0?'+':'-')+'Rp '+groupDigits(String(Math.abs(n))); }
  function formatMoneyInput(raw, allowNeg){
    var neg = allowNeg && /-/.test(raw);
    var digits = raw.replace(/[^\d]/g,'').replace(/^0+(?=\d)/,'');
    if (digits === '') return neg ? '-' : '';
    return (neg?'-':'') + groupDigits(digits);
  }
  function parseMoney(v){ var neg=/-/.test(v); var d=v.replace(/[^\d]/g,''); var n=d===''?0:parseInt(d,10); return neg?-n:n; }

  // ---- Render tabel ----
  var rowsEl = document.getElementById('rows');
  function buildRows(){
    var html = '';
    SIZES.forEach(function(t){
      var label = (t/10).toFixed(1);
      html += '<tr data-t="'+t+'">'
        + '<td class="uk">'+label+'<small>Kg</small></td>'
        + '<td class="cell-mono cell-hpp" data-label="HPP" id="hpp'+t+'">Rp 0</td>'
        + '<td class="cell-mono cell-sel" data-label="Selisih" id="sel'+t+'">Rp 0</td>'
        + '<td class="cell-mono cell-hasil" data-label="Harga Jual" id="jadi'+t+'">Rp 0</td>'
        + '<td class="cell-margin" data-label="Margin" id="mar'+t+'">Rp 0</td>'
        + '</tr>';
    });
    rowsEl.innerHTML = html;
  }

  function recalc(){
    SIZES.forEach(function(t){
      var hpp = hppOf(t), jadi = hargaJadiOf(t), sel = selisihOf(t), mar = marginOf(t);
      document.getElementById('hpp'+t).textContent  = fmtRp(hpp);
      document.getElementById('sel'+t).textContent  = fmtSigned(sel);
      document.getElementById('jadi'+t).textContent = fmtRp(jadi);
      var mEl = document.getElementById('mar'+t);
      mEl.textContent = fmtRp(mar);
      mEl.className = 'cell-margin ' + (mar >= 0 ? 'pos' : 'neg');
      document.querySelector('tr[data-t="'+t+'"]').classList.toggle('anchor-row', t === anchorT);
    });
  }

  // ---- Kontrol acuan ----
  var anchorSizeEl = document.getElementById('anchorSize');
  SIZES.forEach(function(t){
    var o = document.createElement('option');
    o.value = t; o.textContent = (t/10).toFixed(1) + ' Kg';
    anchorSizeEl.appendChild(o);
  });
  anchorSizeEl.value = anchorT;
  anchorSizeEl.addEventListener('change', function(){
    anchorT = +anchorSizeEl.value;               // HPP acuan tetap, HPP tiap ukuran diskalakan ulang dari gramasi
    recalc();
  });

  var hppEl = document.getElementById('hppAcuan');
  hppEl.value = groupDigits(String(hppAcuan));
  hppEl.addEventListener('input', function(){
    hppEl.value = formatMoneyInput(hppEl.value, false);
    hppAcuan = parseMoney(hppEl.value); recalc();
  });

  var anchorPriceEl = document.getElementById('anchorPrice');
  anchorPriceEl.value = groupDigits(String(anchorPrice));
  anchorPriceEl.addEventListener('input', function(){
    anchorPriceEl.value = formatMoneyInput(anchorPriceEl.value, false);
    anchorPrice = parseMoney(anchorPriceEl.value); recalc();
  });

  var stepEl = document.getElementById('stepVal');
  stepEl.value = groupDigits(String(step));
  stepEl.addEventListener('input', function(){
    stepEl.value = formatMoneyInput(stepEl.value, false);
    step = parseMoney(stepEl.value); recalc();
  });

  // ---- Buat gambar daftar harga (JPG) ----
  var lastCanvas = null;
  var brandNameEl = document.getElementById('brandName');
  var selectedCols = { uk:true, hpp:true, sel:true, jadi:true, mar:true };

  var COLS = [
    { key:'uk',   label:'UKURAN',     w:0.9,  font:'700 15px', val:function(t){ return (t/10).toFixed(1)+' Kg'; }, color:function(){ return '#0e1f3d'; } },
    { key:'hpp',  label:'HPP',        w:1.1,  font:'500 14px', val:function(t){ return fmtRp(hppOf(t)); },         color:function(){ return '#5c6b86'; } },
    { key:'sel',  label:'SELISIH',    w:1.05, font:'500 14px', val:function(t){ return fmtSigned(selisihOf(t)); }, color:function(){ return '#5c6b86'; } },
    { key:'jadi', label:'HARGA JUAL', w:1.2,  font:'700 15px', val:function(t){ return fmtRp(hargaJadiOf(t)); },   color:function(){ return '#0e1f3d'; } },
    { key:'mar',  label:'MARGIN',     w:1.1,  font:'700 14px', val:function(t){ return fmtRp(marginOf(t)); },      color:function(t){ return marginOf(t)>=0 ? '#157a3c' : '#c1281f'; } }
  ];

  function stampWIB(){
    try{
      return new Intl.DateTimeFormat('id-ID',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'Asia/Jakarta'}).format(new Date()) + ' WIB';
    }catch(e){ return new Date().toLocaleString('id-ID') + ' WIB'; }
  }

  function buildListImage(cb){
    document.fonts.ready.then(function(){
      var cols = COLS.filter(function(col){ return selectedCols[col.key]; });
      if (cols.length === 0) cols = [COLS[0]];
      var brand = (brandNameEl.value || '').trim() || 'KIMOKE GROUP';
      var stamp = stampWIB();

      var scale = 2, pad = 32;
      var W = Math.max(560, Math.min(900, 70 + cols.length * 165));
      var L = pad, R = W - pad;
      var topH = 118, headH = 46, rowH = 42, footH = 18;
      var H = topH + headH + SIZES.length * rowH + footH;
      var c = document.createElement('canvas');
      var M = 22, rad = 20;
      c.width = (W + 2 * M) * scale; c.height = (H + 2 * M) * scale;
      var x = c.getContext('2d'); x.scale(scale, scale);
      x.textBaseline = 'alphabetic';

      function rr(px, py, pw, ph, r){
        x.beginPath();
        x.moveTo(px + r, py);
        x.arcTo(px + pw, py, px + pw, py + ph, r);
        x.arcTo(px + pw, py + ph, px, py + ph, r);
        x.arcTo(px, py + ph, px, py, r);
        x.arcTo(px, py, px + pw, py, r);
        x.closePath();
      }

      // Latar luar putih + kartu putih bersudut melengkung dengan bayangan lembut
      x.fillStyle = '#ffffff'; x.fillRect(0, 0, W + 2 * M, H + 2 * M);
      x.save();
      x.shadowColor = 'rgba(14,31,61,0.10)'; x.shadowBlur = 24; x.shadowOffsetY = 6;
      x.fillStyle = '#ffffff'; rr(M, M, W, H, rad); x.fill();
      x.restore();

      // Semua isi dipotong mengikuti lengkung kartu
      x.save();
      x.translate(M, M);
      rr(0, 0, W, H, rad); x.clip();
      x.fillStyle = '#ffffff'; x.fillRect(0, 0, W, H);

      // Baris atas: nama/judul (kiri) + tanggal & jam WIB real-time (kanan)
      x.fillStyle = '#1457d6'; x.font = '700 13px "Plus Jakarta Sans",sans-serif';
      x.textAlign = 'left';  x.fillText(brand.toUpperCase(), L, 40);
      x.fillStyle = '#5c6b86'; x.font = '500 12px "Plus Jakarta Sans",sans-serif';
      x.textAlign = 'right'; x.fillText(stamp, R, 40);

      x.textAlign = 'left';
      x.fillStyle = '#0e1f3d'; x.font = '800 26px "Plus Jakarta Sans",sans-serif';
      x.fillText('Daftar Harga Bubble Wrap', L, 72);
      x.fillStyle = '#5c6b86'; x.font = '500 14px "Plus Jakarta Sans",sans-serif';
      x.fillText('Acuan ' + (anchorT/10).toFixed(1) + ' Kg = ' + fmtRp(anchorPrice) + '  ·  selisih ' + fmtRp(step) + '/ukuran', L, 98);

      // Lebar kolom proporsional dari kolom yang dipilih
      var totW = 0; cols.forEach(function(col){ totW += col.w; });
      var bounds = [L], acc = L;
      cols.forEach(function(col){ acc += (col.w / totW) * (R - L); bounds.push(acc); });
      function cc(i){ return (bounds[i] + bounds[i + 1]) / 2; }

      // Header band
      var hY = topH;
      x.fillStyle = '#e7f0ff'; x.fillRect(0, hY, W, headH);
      x.fillStyle = '#1457d6'; x.fillRect(0, hY, W, 2); x.fillRect(0, hY + headH - 2, W, 2);
      x.fillStyle = '#0b3fa8'; x.font = '800 12px "Plus Jakarta Sans",sans-serif';
      x.textAlign = 'center';
      var hmid = hY + headH/2 + 4;
      cols.forEach(function(col, i){ x.fillText(col.label, cc(i), hmid); });

      // Baris
      var startY = hY + headH;
      SIZES.forEach(function(t, r){
        var ry = startY + r * rowH, mid = ry + rowH/2 + 5;
        x.textAlign = 'center';
        cols.forEach(function(col, i){
          x.fillStyle = col.color(t);
          x.font = col.font + ' "JetBrains Mono",monospace';
          x.fillText(col.val(t), cc(i), mid);
        });
        if (r < SIZES.length - 1){ x.fillStyle = '#e3e9f3'; x.fillRect(0, ry + rowH - 1, W, 1); }
      });


      x.restore();
      // Garis tepi kartu
      x.save(); x.translate(M, M);
      x.strokeStyle = '#d2dcec'; x.lineWidth = 1; rr(0.5, 0.5, W - 1, H - 1, rad); x.stroke();
      x.restore();

      lastCanvas = c;
      cb(c.toDataURL('image/jpeg', 0.95));
    });
  }

  function refreshPreview(){
    buildListImage(function(url){ document.getElementById('jpgImg').src = url; });
  }

  var jpgOverlay = document.getElementById('jpgOverlay');
  document.getElementById('jpgBtn').addEventListener('click', function(){
    refreshPreview();
    jpgOverlay.classList.add('show');
  });
  document.getElementById('jpgClose').addEventListener('click', function(){ jpgOverlay.classList.remove('show'); });
  jpgOverlay.addEventListener('click', function(e){ if (e.target === jpgOverlay) jpgOverlay.classList.remove('show'); });

  brandNameEl.addEventListener('input', refreshPreview);
  document.getElementById('colChips').addEventListener('click', function(e){
    var b = e.target.closest('.chip'); if (!b) return;
    var k = b.getAttribute('data-col');
    var active = Object.keys(selectedCols).filter(function(key){ return selectedCols[key]; });
    if (selectedCols[k] && active.length <= 1){ showToast('Minimal 1 kolom'); return; }
    selectedCols[k] = !selectedCols[k];
    b.classList.toggle('active', selectedCols[k]);
    refreshPreview();
  });

  document.getElementById('jpgDownload').addEventListener('click', function(){
    buildListImage(function(){
      if (!lastCanvas) return;
      lastCanvas.toBlob(function(b){
        var url = URL.createObjectURL(b);
        var a = document.createElement('a');
        a.href = url; a.download = 'Daftar-Harga-Bubblewrap.jpg';
        document.body.appendChild(a); a.click();
        setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 1000);
        showToast('JPG didownload ✓');
      }, 'image/jpeg', 0.95);
    });
  });

  // ---- Toast ----
  var toastEl = document.getElementById('toast'), toastTimer;
  function showToast(msg){
    toastEl.textContent = msg; toastEl.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 1900);
  }

  buildRows();
  recalc();
</script>
</body>
</html>
